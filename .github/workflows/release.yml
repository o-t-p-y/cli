name: release

on:
  push:
    tags:
      - "sdk@*"
      - "otpy-cli@*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (sigstore) — REQUIRED, do not remove
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no cache: pnpm — lockfile intentionally absent until task-16 hardening
          registry-url: https://registry.npmjs.org

      - run: pnpm install

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            otpy-cli@*)
              DIR="packages/cli"
              VERSION="${TAG#otpy-cli@}"
              ;;
            sdk@*)
              DIR="packages/otpy"
              VERSION="${TAG#sdk@}"
              ;;
            *)
              echo "Unexpected tag $TAG"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify tag matches package name and version
        run: |
          DIR="${{ steps.pkg.outputs.dir }}"
          PKG_NAME="$(node -p "require('./$DIR/package.json').name")"
          PKG_VERSION="$(node -p "require('./$DIR/package.json').version")"
          # Scoped packages: tag prefix is the short name (sdk, otpy-cli)
          # Unscoped packages: tag prefix is the full name
          EXPECTED_SHORT="${GITHUB_REF_NAME%@*}"
          EXPECTED_FULL=""
          case "$EXPECTED_SHORT" in
            sdk) EXPECTED_FULL="@o-t-p-y/sdk" ;;
            *) EXPECTED_FULL="$EXPECTED_SHORT" ;;
          esac
          if [ "$PKG_NAME" != "$EXPECTED_FULL" ]; then
            echo "Package name $PKG_NAME does not match expected $EXPECTED_FULL (tag prefix $EXPECTED_SHORT)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} != package.json $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
